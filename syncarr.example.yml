# Copy this file to a private config location and mount it into the container.
# Put endpoint URLs and API keys in environment variables; never add keys here.
test_run: true
# Optional one-time run: execute every configured unit once, then stay idle.
reinitialize_b: false

instances:
  movie_source:
    type: radarr
    url_env: RADARR_SOURCE_URL
    api_key_env: RADARR_SOURCE_KEY
  movie_target:
    type: radarr
    url_env: RADARR_TARGET_URL
    api_key_env: RADARR_TARGET_KEY
    delete_conflict_policy: keep_if_any_source

# A pair owns one interval and a set of transfer rules.
pairs:
  - id: movies
    source: movie_source
    target: movie_target
    interval_seconds: 300

    # Match the existing source and target profile names on these instances.
    profile_mappings:
      - source_profile: Source HD
        target_profile: Target HD
      - source_profile: Source 4K
        target_profile: Target 4K

    root_mappings:
      - source: /source/movies
        target: /target/movies

    rules:
      - id: bluray
        source_quality_match: '^Bluray'
      - id: selected_format
        source_custom_format_mode: any
        source_custom_format_names:
          - Example Format

    # Deletion remains opt-in. Rules may override shared settings:
    # delete_missing: true
    # delete_files: false
